<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Timetable & Schedule</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        /* Smooth scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Timetable cell with subtle dashed border */
        .timetable-cell {
            min-height: 165px;
            border: 1.5px dashed #cbd5e1;
            transition: all 0.2s ease;
        }
        .timetable-cell:hover {
            border-color: #94a3b8;
            background-color: rgba(241, 245, 249, 0.7);
        }

        /* Hover animation for class cards */
        .event-card {
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-3 md:p-6 lg:p-8">

    <!-- Expanded container for widescreen views -->
    <div class="max-w-[1800px] mx-auto bg-white rounded-3xl shadow-2xl border border-slate-200/90 overflow-hidden">

        <div class="overflow-x-auto p-4 md:p-6 lg:p-8">
            <div class="min-w-[1200px]">
                
                <!-- Day Header Columns with Custom Day Colors -->
                <div class="grid grid-cols-6 gap-4 mb-4 text-center items-stretch">
                    <!-- Time Column Header -->
                    <div class="text-sm font-extrabold text-slate-700 flex items-center justify-center bg-slate-100/80 rounded-2xl border border-slate-200/80">
                        <i class="fa-regular fa-clock mr-2 text-indigo-500"></i> Time Slot
                    </div>
                    
                    <!-- Sunday Header -->
                    <div class="flex flex-col items-center justify-center py-3.5 rounded-2xl bg-emerald-50 border border-emerald-200/80 text-emerald-950">
                        <span class="text-sm font-extrabold uppercase tracking-wider text-emerald-700">Sunday</span>
                    </div>

                    <!-- Monday Header -->
                    <div class="flex flex-col items-center justify-center py-3.5 rounded-2xl bg-rose-50 border border-rose-200/80 text-rose-950">
                        <span class="text-sm font-extrabold uppercase tracking-wider text-rose-700">Monday</span>
                    </div>

                    <!-- Tuesday Header -->
                    <div class="flex flex-col items-center justify-center py-3.5 rounded-2xl bg-blue-50 border border-blue-200/80 text-blue-950">
                        <span class="text-sm font-extrabold uppercase tracking-wider text-blue-700">Tuesday</span>
                    </div>

                    <!-- Wednesday Header -->
                    <div class="flex flex-col items-center justify-center py-3.5 rounded-2xl bg-purple-50 border border-purple-200/80 text-purple-950 relative">
                        <span class="text-sm font-extrabold uppercase tracking-wider text-purple-700">Wednesday</span>
                    </div>

                    <!-- Thursday Header -->
                    <div class="flex flex-col items-center justify-center py-3.5 rounded-2xl bg-amber-50 border border-amber-200/80 text-amber-950">
                        <span class="text-sm font-extrabold uppercase tracking-wider text-amber-700">Thursday</span>
                    </div>
                </div>

                <!-- Timetable slots grid -->
                <div id="timetableGrid" class="space-y-4">
                    <!-- Dynamic slots injected via JS -->
                </div>

            </div>
        </div>

    </div>

    <!-- Add / Edit Class Modal -->
    <div id="eventModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all border border-slate-100">
            <!-- Modal Header -->
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-extrabold text-slate-900">Add New Class</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-200/60 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="eventForm" class="p-6 space-y-4">
                <input type="hidden" id="eventId">

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Course Title</label>
                    <input type="text" id="eventTitle" required placeholder="e.g. Civilisation de la langue d'étude" 
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Doctor / Professor</label>
                        <input type="text" id="eventProfessor" placeholder="e.g. Dr. Hallouch" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Group & Room Location</label>
                        <input type="text" id="eventLocation" placeholder="e.g. (Gr 2-3-4) AMPHI 4" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Day</label>
                        <select id="eventDay" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800 bg-white">
                            <option value="0">Sunday</option>
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Type / Format</label>
                        <select id="eventCategory" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800 bg-white">
                            <option value="Cours">Cours</option>
                            <option value="TD">TD</option>
                            <option value="TP">TP / Lab</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Time Slot</label>
                        <select id="eventSlot" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800 bg-white">
                            <option value="08:30 - 10:00">08:30 - 10:00</option>
                            <option value="10:00 - 11:30">10:00 - 11:30</option>
                            <option value="11:30 - 13:00">11:30 - 13:00</option>
                            <option value="13:00 - 14:30">13:00 - 14:30</option>
                            <option value="14:30 - 16:00">14:30 - 16:00</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Badge Display Time</label>
                        <input type="text" id="eventTimeBadge" placeholder="08:30 - 10:00" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800">
                    </div>
                </div>

                <div class="pt-3 flex items-center justify-between border-t border-slate-100">
                    <button type="button" id="deleteEventBtn" class="hidden px-4 py-2 text-sm font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> Delete Class
                    </button>
                    
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" id="cancelModalBtn" class="px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                            Cancel
                        </button>
                        <button type="submit" class="px-5 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md transition">
                            Save Class
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Specific color themes per day of the week
        const dayThemes = {
            0: { // Sunday: Green Theme
                cardBg: 'bg-[#dcfce7]', 
                border: 'border-emerald-300',
                titleColor: 'text-[#064e3b]',
                subColor: 'text-[#047857]',
                badgeBg: 'bg-[#a7f3d0] text-[#064e3b]',
                dotColor: 'bg-[#047857]'
            },
            1: { // Monday: Red / Coral Theme
                cardBg: 'bg-[#ffe4e6]', 
                border: 'border-rose-300',
                titleColor: 'text-[#881337]',
                subColor: 'text-[#be123c]',
                badgeBg: 'bg-[#fecdd3] text-[#881337]',
                dotColor: 'bg-[#be123c]'
            },
            2: { // Tuesday: Blue Theme
                cardBg: 'bg-[#dbeafe]', 
                border: 'border-blue-300',
                titleColor: 'text-[#1e3a8a]',
                subColor: 'text-[#1d4ed8]',
                badgeBg: 'bg-[#bfdbfe] text-[#1e3a8a]',
                dotColor: 'bg-[#1d4ed8]'
            },
            3: { // Wednesday: Violet / Purple Theme
                cardBg: 'bg-[#f3e8ff]', 
                border: 'border-purple-300',
                titleColor: 'text-[#581c87]',
                subColor: 'text-[#7e22ce]',
                badgeBg: 'bg-[#e9d5ff] text-[#581c87]',
                dotColor: 'bg-[#7e22ce]'
            },
            4: { // Thursday: Amber / Gold Theme
                cardBg: 'bg-[#fef3c7]', 
                border: 'border-amber-300',
                titleColor: 'text-[#78350f]',
                subColor: 'text-[#b45309]',
                badgeBg: 'bg-[#fde68a] text-[#78350f]',
                dotColor: 'bg-[#b45309]'
            }
        };

        // Standard time slots requested
        const timeSlots = [
            "08:30 - 10:00",
            "10:00 - 11:30",
            "11:30 - 13:00",
            "13:00 - 14:30",
            "14:30 - 16:00"
        ];

        // User's exact schedule
        const defaultEvents = [
            // --- SUNDAY (Green Day) ---
            {
                id: 'sun-1',
                day: 0,
                slotIndex: 0, // 08:30 - 10:00
                category: 'Cours',
                title: "Civilisation de la langue d'étude",
                professor: 'Dr. Hallouch',
                location: '(Gr 2-3-4) AMPHI 4',
                timeBadge: '08:30 - 10:00'
            },
            {
                id: 'sun-2',
                day: 0,
                slotIndex: 1, // 10:00 - 11:30
                category: 'TD',
                title: 'Techniques du travail universitaire',
                professor: 'Dr. Brahmi',
                location: 'G2 SALLE 2',
                timeBadge: '10:00 - 11:30'
            },
            {
                id: 'sun-3',
                day: 0,
                slotIndex: 2, // 11:30 - 13:00
                category: 'TD',
                title: 'Compréhension et expression orale',
                professor: 'Dr. Hamadi',
                location: 'G2 SALLE 6',
                timeBadge: '11:30 - 13:00'
            },

            // --- MONDAY (Red Day) ---
            {
                id: 'mon-1',
                day: 1,
                slotIndex: 0, // 08:30 - 10:00
                category: 'TD',
                title: 'Littératures de la langue d’étude',
                professor: 'Dr. Bedjaoui',
                location: 'G2 SALLE 2',
                timeBadge: '08:30 - 10:00'
            },
            {
                id: 'mon-2',
                day: 1,
                slotIndex: 1, // 10:00 - 11:30
                category: 'TD',
                title: 'Linguistique et Phonétique',
                professor: 'Dr. Daoudi',
                location: 'G2 SALLE ???',
                timeBadge: '10:00 - 11:30'
            },

            // --- TUESDAY (Blue Day) ---
            {
                id: 'tue-1',
                day: 2,
                slotIndex: 0, // 08:30 - 10:00
                category: 'TD',
                title: 'Written Expression and Comprehension',
                professor: 'Dr. Derrar',
                location: 'G2 SALLE 2',
                timeBadge: '08:30 - 10:00'
            },
            {
                id: 'tue-2',
                day: 2,
                slotIndex: 1, // 10:00 - 11:30
                category: 'TD',
                title: "Civilisation de la langue d'étude",
                professor: 'Dr. Hallouche',
                location: 'G2 SALLE 6',
                timeBadge: '10:00 - 11:30'
            },
            {
                id: 'tue-3',
                day: 2,
                slotIndex: 3, // 13:00 - 14:30
                category: 'Cours',
                title: 'Grammaire de la langue d’étude',
                professor: 'Dr. Benmmoussat',
                location: 'G2 SALLE 2',
                timeBadge: '13:00 - 14:30'
            },

            // --- WEDNESDAY (Violet Day) --- (ALL FREE!)

            // --- THURSDAY (Amber Day) ---
            {
                id: 'thu-1',
                day: 4,
                slotIndex: 1, // 10:00 - 11:30
                category: 'TD',
                title: 'Français',
                professor: 'Ms. Mahdjoub',
                location: 'G2 SALLE ???',
                timeBadge: '10:00 - 11:30'
            },
            {
                id: 'thu-2',
                day: 4,
                slotIndex: 2, // 11:30 - 13:00
                category: 'TP',
                title: 'Digital Literacy',
                professor: 'Dr. Meddoudi',
                location: 'G2 Lab 5',
                timeBadge: '11:30 - 13:00'
            },
            {
                id: 'thu-3',
                day: 4,
                slotIndex: 3, // 13:00 - 14:30
                category: 'TD',
                title: 'Lecture et étude de textes',
                professor: 'Dr. Merzoug',
                location: 'G2 SALLE 2',
                timeBadge: '13:00 - 14:30'
            }
        ];

        let events = [];

        function loadEvents() {
            const saved = localStorage.getItem('uni_timetable_events_v3');
            if (saved) {
                try {
                    events = JSON.parse(saved);
                } catch (e) {
                    events = [...defaultEvents];
                }
            } else {
                events = [...defaultEvents];
            }
        }

        function saveEvents() {
            localStorage.setItem('uni_timetable_events_v3', JSON.stringify(events));
        }

        function renderTimetable() {
            const gridContainer = document.getElementById('timetableGrid');
            const filterEl = document.getElementById('categoryFilter');
            const selectedCategory = filterEl ? filterEl.value : 'ALL';
            gridContainer.innerHTML = '';

            timeSlots.forEach((slot, slotIndex) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-6 gap-4 items-stretch';

                // Time Column
                const timeCol = document.createElement('div');
                timeCol.className = 'flex flex-col items-center justify-center text-center text-xs md:text-sm font-bold text-slate-700 bg-slate-50 p-3 rounded-2xl border border-slate-200/80 tracking-tight';
                timeCol.innerHTML = `
                    <span class="text-indigo-600 font-extrabold text-sm">${slot.split(' - ')[0]}</span>
                    <span class="text-slate-400 font-medium text-xs">to ${slot.split(' - ')[1]}</span>
                `;
                row.appendChild(timeCol);

                // Day Columns (0 = Sunday to 4 = Thursday)
                for (let day = 0; day < 5; day++) {
                    const cell = document.createElement('div');
                    cell.className = 'timetable-cell rounded-2xl p-2.5 flex flex-col justify-center relative group cursor-pointer bg-white/60';
                    cell.dataset.day = day;
                    cell.dataset.slotIndex = slotIndex;

                    const matchedEvents = events.filter(e => 
                        e.day === day && 
                        e.slotIndex === slotIndex &&
                        (selectedCategory === 'ALL' || e.category === selectedCategory)
                    );

                    if (matchedEvents.length > 0) {
                        matchedEvents.forEach(evt => {
                            const theme = dayThemes[evt.day] || dayThemes[0];
                            
                            const card = document.createElement('div');
                            card.className = `event-card ${theme.cardBg} border ${theme.border} p-3.5 rounded-2xl flex flex-col justify-between h-full w-full relative shadow-sm hover:shadow-md cursor-pointer`;
                            
                            card.innerHTML = `
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span class="px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider rounded-md ${theme.badgeBg}">
                                            ${evt.category || 'Class'}
                                        </span>
                                        <button class="edit-btn text-xs text-slate-500 hover:text-slate-900 p-1 rounded transition" data-id="${evt.id}">
                                            <i class="fa-solid fa-ellipsis"></i>
                                        </button>
                                    </div>
                                    
                                    <!-- Full Title Display without Truncation -->
                                    <h4 class="text-xs md:text-sm font-black ${theme.titleColor} leading-snug mb-2 whitespace-normal break-words">
                                        ${evt.title}
                                    </h4>
                                </div>

                                <div class="space-y-1 pt-1 mt-auto border-t border-slate-900/5">
                                    <div class="text-xs font-bold ${theme.subColor} flex items-center gap-1.5">
                                        <i class="fa-solid fa-user-tie text-[11px] opacity-80"></i>
                                        <span>${evt.professor || 'N/A'}</span>
                                    </div>
                                    
                                    <div class="flex items-center justify-between text-[11px] font-bold ${theme.subColor} pt-0.5">
                                        <span class="flex items-center gap-1">
                                            <i class="fa-solid fa-location-dot text-[10px] opacity-80"></i>
                                            <span>${evt.location || 'Room TBD'}</span>
                                        </span>
                                        <span class="text-[10px] font-extrabold opacity-75">${evt.timeBadge}</span>
                                    </div>
                                </div>
                            `;

                            // Options & Click triggers
                            card.querySelector('.edit-btn').addEventListener('click', (e) => {
                                e.stopPropagation();
                                openModalForEdit(evt.id);
                            });

                            card.addEventListener('click', (e) => {
                                e.stopPropagation();
                                openModalForEdit(evt.id);
                            });

                            cell.appendChild(card);
                        });
                    } else {
                        // Empty Slot indicator with day hint on hover
                        cell.innerHTML = `
                            <div class="h-full w-full flex flex-col items-center justify-center text-slate-300 group-hover:text-slate-500 transition py-4">
                                <i class="fa-solid fa-plus text-base mb-1"></i>
                                <span class="text-[10px] font-bold tracking-wider opacity-0 group-hover:opacity-100 transition">ADD CLASS</span>
                            </div>
                        `;

                        cell.addEventListener('click', () => {
                            openModalForAdd(day, slotIndex);
                        });
                    }

                    row.appendChild(cell);
                }

                gridContainer.appendChild(row);
            });
        }

        const eventModal = document.getElementById('eventModal');
        const eventForm = document.getElementById('eventForm');

        function openModalForAdd(day = 0, slotIndex = 0) {
            document.getElementById('modalTitle').textContent = 'Add New Class';
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventProfessor').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventCategory').value = 'TD';
            document.getElementById('eventDay').value = day;
            document.getElementById('eventSlot').value = timeSlots[slotIndex] || timeSlots[0];
            document.getElementById('eventTimeBadge').value = timeSlots[slotIndex] || '08:30 - 10:00';
            document.getElementById('deleteEventBtn').classList.add('hidden');
            
            eventModal.classList.remove('hidden');
        }

        function openModalForEdit(id) {
            const evt = events.find(e => e.id === id);
            if (!evt) return;

            document.getElementById('modalTitle').textContent = 'Edit Class Details';
            document.getElementById('eventId').value = evt.id;
            document.getElementById('eventTitle').value = evt.title;
            document.getElementById('eventProfessor').value = evt.professor || '';
            document.getElementById('eventLocation').value = evt.location || '';
            document.getElementById('eventCategory').value = evt.category || 'TD';
            document.getElementById('eventDay').value = evt.day;
            document.getElementById('eventSlot').value = timeSlots[evt.slotIndex] || timeSlots[0];
            document.getElementById('eventTimeBadge').value = evt.timeBadge || timeSlots[evt.slotIndex];
            document.getElementById('deleteEventBtn').classList.remove('hidden');

            eventModal.classList.remove('hidden');
        }

        function closeModal() {
            eventModal.classList.add('hidden');
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
        document.getElementById('openAddModalBtn')?.addEventListener('click', () => openModalForAdd());

        // Save / Submit Form Logic
        eventForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const id = document.getElementById('eventId').value;
            const title = document.getElementById('eventTitle').value.trim();
            const professor = document.getElementById('eventProfessor').value.trim();
            const location = document.getElementById('eventLocation').value.trim();
            const category = document.getElementById('eventCategory').value;
            const day = parseInt(document.getElementById('eventDay').value);
            const slotValue = document.getElementById('eventSlot').value;
            const slotIndex = timeSlots.indexOf(slotValue);
            const timeBadge = document.getElementById('eventTimeBadge').value.trim();

            if (!title) return;

            if (id) {
                const index = events.findIndex(e => e.id === id);
                if (index !== -1) {
                    events[index] = { 
                        id, 
                        title, 
                        professor, 
                        location, 
                        category, 
                        day, 
                        slotIndex: slotIndex >= 0 ? slotIndex : 0, 
                        timeBadge 
                    };
                }
            } else {
                const newEvt = {
                    id: 'class-' + Date.now().toString(),
                    title,
                    professor,
                    location,
                    category,
                    day,
                    slotIndex: slotIndex >= 0 ? slotIndex : 0,
                    timeBadge
                };
                events.push(newEvt);
            }

            saveEvents();
            renderTimetable();
            closeModal();
        });

        // Delete Event Button
        document.getElementById('deleteEventBtn').addEventListener('click', () => {
            const id = document.getElementById('eventId').value;
            if (id) {
                events = events.filter(e => e.id !== id);
                saveEvents();
                renderTimetable();
                closeModal();
            }
        });

        // Filter and Reset triggers
        document.getElementById('categoryFilter')?.addEventListener('change', renderTimetable);

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            loadEvents();
            renderTimetable();
        });
    </script>
</body>
</html>
